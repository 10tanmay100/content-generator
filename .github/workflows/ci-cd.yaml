# ============================================================================
# CI/CD: test on every push/PR; on push to main, build+push images, deploy
# the Bicep infrastructure, and roll out new Container App revisions.
#
# Auth uses OpenID Connect (OIDC) federated credentials — no client secret
# or password is stored in GitHub at all. See the one-time Azure setup in
# the repo's DEPLOYMENT.md before this workflow can run.
# ============================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # required for OIDC login to Azure
  contents: read

env:
  RESOURCE_GROUP: rg-content-pipeline-dev
  ACR_NAME: contentpipedevacr          # must match infra output acrLoginServer's prefix (no ".azurecr.io")
  BACKEND_REPO: content-backend
  FRONTEND_REPO: content-frontend

jobs:
  # --------------------------------------------------------------------------
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run tests
        working-directory: backend
        env:
          API_AUTH_TOKEN: test-token
          CREWAI_DISABLE_TELEMETRY: "true"
        run: pytest -v

  # --------------------------------------------------------------------------
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build

  # --------------------------------------------------------------------------
  build-and-push:
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # ACR Tasks (`az acr build`) is blocked on Free Trial / student Azure
      # subscriptions with "TasksOperationsNotAllowed" — a subscription-tier
      # restriction, not a permissions issue. Building with plain Docker and
      # pushing directly works on any subscription tier, so that's used here
      # instead. If you're on Pay-As-You-Go and prefer ACR Tasks (it can be
      # marginally simpler), swap these steps back to `az acr build`.
      - name: Fetch ACR admin credentials
        id: acr-creds
        run: |
          USERNAME=$(az acr credential show --name ${{ env.ACR_NAME }} --query username -o tsv)
          PASSWORD=$(az acr credential show --name ${{ env.ACR_NAME }} --query "passwords[0].value" -o tsv)
          echo "::add-mask::$PASSWORD"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "password=$PASSWORD" >> "$GITHUB_OUTPUT"

      - name: Log in to ACR via Docker
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_NAME }}.azurecr.io
          username: ${{ steps.acr-creds.outputs.username }}
          password: ${{ steps.acr-creds.outputs.password }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_REPO }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_REPO }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_REPO }}:${{ steps.vars.outputs.image_tag }}
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_REPO }}:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # --------------------------------------------------------------------------
  deploy-infra:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production   # gives you a manual-approval gate if you enable one under Settings > Environments
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # A resource's Azure region is immutable once created — ARM's normal
      # idempotent create-or-update can't reconcile a location change, it
      # just fails with a cryptic "InvalidResourceLocation" conflict. This
      # checks each region-sensitive resource's ACTUAL location against
      # what infra/parameters.json currently specifies, and only deletes
      # (so the next step recreates it fresh in the right place) when
      # there's a genuine mismatch. Resources already in the right place
      # are never touched.
      - name: Deploy Bicep template
        run: |
          # Resolve the ACTUAL location to deploy each region-sensitive
          # resource to. If it already exists, use wherever it already is —
          # Bicep/ARM treats a matching location as a harmless no-op update,
          # so there's nothing to delete or wait on. Only fall back to the
          # configured default when the resource doesn't exist yet, so it
          # gets created fresh in the intended region.
          DESIRED_LOCATION=$(python3 -c "import json; print(json.load(open('infra/parameters.json'))['parameters']['location']['value'])")
          DESIRED_COSMOS_LOCATION=$(python3 -c "
          import json
          p = json.load(open('infra/parameters.json'))['parameters']
          print(p.get('cosmosLocation', {}).get('value', p['location']['value']))
          ")
          DESIRED_SEARCH_LOCATION=$(python3 -c "
          import json
          p = json.load(open('infra/parameters.json'))['parameters']
          print(p.get('searchLocation', {}).get('value', p['location']['value']))
          ")

          effective_location() {
            local name="$1" rtype="$2" desired="$3"
            local current
            current=$(az resource show --resource-group ${{ env.RESOURCE_GROUP }} --name "$name" \
              --resource-type "$rtype" --query location -o tsv 2>/dev/null || true)
            if [ -n "$current" ]; then
              echo "  $name: already exists in '$current' — using that (no delete, no recreate)" >&2
              echo "$current"
            else
              echo "  $name: doesn't exist yet — will be created fresh in '$desired'" >&2
              echo "$desired"
            fi
          }

          # Log Analytics and App Insights are always created together by the
          # same monitor.bicep module call, so checking Log Analytics alone
          # is enough to know where both of them already live.
          EFFECTIVE_LOCATION=$(effective_location "contentpipe-dev-law" "Microsoft.OperationalInsights/workspaces" "$DESIRED_LOCATION")
          EFFECTIVE_COSMOS_LOCATION=$(effective_location "contentpipedevcosmos" "Microsoft.DocumentDB/databaseAccounts" "$DESIRED_COSMOS_LOCATION")
          EFFECTIVE_SEARCH_LOCATION=$(effective_location "contentpipedevsearch" "Microsoft.Search/searchServices" "$DESIRED_SEARCH_LOCATION")

          echo "Deploying with location=$EFFECTIVE_LOCATION cosmosLocation=$EFFECTIVE_COSMOS_LOCATION searchLocation=$EFFECTIVE_SEARCH_LOCATION"

          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file infra/main.bicep \
            --parameters infra/parameters.json \
            --parameters \
              location="$EFFECTIVE_LOCATION" \
              cosmosLocation="$EFFECTIVE_COSMOS_LOCATION" \
              searchLocation="$EFFECTIVE_SEARCH_LOCATION" \
              backendImage=${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_REPO }}:${{ needs.build-and-push.outputs.image-tag }} \
              frontendImage=${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_REPO }}:${{ needs.build-and-push.outputs.image-tag }} \
              apiAuthToken="${{ secrets.API_AUTH_TOKEN }}" \
              anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}"

  # --------------------------------------------------------------------------
  deploy-apps:
    needs: [deploy-infra, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Roll out backend
        run: |
          az containerapp update \
            --name contentpipe-dev-backend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.BACKEND_REPO }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Roll out frontend
        run: |
          az containerapp update \
            --name contentpipe-dev-frontend \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.FRONTEND_REPO }}:${{ needs.build-and-push.outputs.image-tag }}

      - name: Print URLs
        run: |
          echo "Backend:  https://$(az containerapp show -n contentpipe-dev-backend -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"
          echo "Frontend: https://$(az containerapp show -n contentpipe-dev-frontend -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)"

  # --------------------------------------------------------------------------
  # Post-deploy verification: actually calls the live backend API — not just
  # checking that the container started. /content/generate/sync exercises
  # the full real path (backend -> Anthropic's Claude API -> back), so a
  # pass here proves the API key works and generation actually runs, not
  # just that the container is "up".
  smoke-test:
    needs: [deploy-apps, build-and-push]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve backend URL
        id: url
        run: |
          FQDN=$(az containerapp show -n contentpipe-dev-backend -g ${{ env.RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          echo "backend_url=https://$FQDN" >> "$GITHUB_OUTPUT"

      - name: Wait for the backend to be healthy
        run: |
          URL="${{ steps.url.outputs.backend_url }}/api/v1/health"
          echo "Polling $URL ..."
          for i in $(seq 1 20); do
            if curl -sf --max-time 10 "$URL" > /dev/null; then
              echo "Backend is healthy."
              exit 0
            fi
            echo "Not ready yet (attempt $i/20), waiting 15s..."
            sleep 15
          done
          echo "::error::Backend never became healthy."
          exit 1

      # No self-hosted model to warm up anymore — Claude runs on Anthropic's
      # infrastructure, so a much shorter timeout is enough here than the
      # 900s this used to need while Ollama was still pulling models.
      - name: Generate real content through the deployed API (exercises Claude end-to-end)
        run: |
          # No -f here deliberately: with -f, curl swallows the response
          # body on any non-2xx status, making failures undiagnosable.
          # Capture the status code and body separately instead, so a
          # failure always shows exactly what the backend actually said.
          HTTP_STATUS=$(curl -s --max-time 120 -o /tmp/response.json -w "%{http_code}" \
            -X POST "${{ steps.url.outputs.backend_url }}/api/v1/content/generate/sync" \
            -H "Authorization: Bearer ${{ secrets.API_AUTH_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "topic": "A short smoke test of the deployment pipeline",
              "content_format": "blog",
              "word_count": 150,
              "generate_image": false,
              "generate_social_variants": false
            }')

          echo "HTTP status: $HTTP_STATUS"
          echo "Response body:"
          cat /tmp/response.json
          echo ""

          if [ "$HTTP_STATUS" == "200" ] && grep -q '"body_markdown"' /tmp/response.json; then
            echo "Smoke test passed: received a real generated article from the deployed pipeline."
          else
            echo "::error::Smoke test failed: response did not contain a generated article."
            exit 1
          fi